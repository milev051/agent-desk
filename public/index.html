<!doctype html>
<html lang="sr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Desk</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
  <aside class="sidebar">
    <div class="sidebar-actions"><div id="new-agents" role="group" aria-label="Novi čet"><button id="defaults-open" aria-label="Podešavanja" title="Podešavanja"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="#000"/><circle cx="15" cy="17" r="3" fill="#000"/></svg></button></div></div>
    <nav id="chats" aria-label="Četovi"></nav>
  </aside>
  <aside id="agent-panel" aria-label="Pokrenuti agenti" hidden><nav id="agent-tree" aria-label="Agenti i podagenti"></nav></aside>
  <main>
    <div id="chat-navigation"><button id="chat-back" aria-label="Lista četova">←</button><button id="chat-parent" aria-label="Roditeljski čet" hidden>↑</button><span id="chat-title"></span><button id="chat-options" aria-label="Opcije otvorenog četa" hidden></button></div>
    <section id="defaults" aria-label="Podešavanja" hidden>
      <form id="defaults-form">
        <div class="defaults-heading"><span></span><span>Model</span><span>Razmišljanje</span></div>
        <div id="default-agents"></div>
        <label class="color-setting">Boja odgovora<select id="response-colors"><option value="label">Samo oznaka modela</option><option value="full">Oznaka i tekst odgovora</option></select></label>
        <label class="color-setting">Tastatura pri otvaranju četa na telefonu<input id="mobile-autofocus" type="checkbox"></label>
        <fieldset class="title-settings"><legend>Naslovi četova</legend>
          <div class="title-key-row"><input id="google-title-key" type="password" autocomplete="off" aria-label="Google API ključ za naslove" placeholder="Google API ključ"><button id="title-check" type="button">Proveri</button></div>
          <small id="title-status" aria-live="polite"></small>
        </fieldset>
        <fieldset class="phone-settings"><legend>Telefon · Tailscale</legend><small id="phone-status"></small><img id="phone-qr" alt="QR kod za jednokratnu prijavu" width="180" height="180" hidden><input id="phone-link" readonly aria-label="Privremeni link za telefon" hidden><div class="settings-actions"><button id="phone-copy" type="button">Kopiraj link</button><button id="phone-revoke" type="button" hidden>Odjavi telefone</button></div></fieldset>
        <section id="project-usage"><div>Potrošnja projekata</div><div id="project-usage-list"></div></section>
        <div class="settings-actions"><button id="defaults-close" type="button">Zatvori</button><button type="submit">Sačuvaj</button></div>
      </form>
    </section>
    <section id="record-panel" class="chat-panel" aria-label="Zapis četa" hidden><div class="panel-content"><h2>Zapis četa</h2><textarea id="record-text" rows="18" readonly aria-label="Zapis četa, samo za čitanje"></textarea><div class="settings-actions"><button data-close-panel>Zatvori</button></div></div></section>

    <div id="conversation" aria-live="polite"></div>
    <div class="composer-area">
      <details id="usage-details" hidden><summary id="usage-heading">Potrošnja</summary><div id="usage-breakdown"></div></details>
      <div id="transfer-preview" aria-live="polite" hidden></div>
      <div id="queue" aria-label="Red čekanja"></div>
      <span id="connection" hidden>Veza je prekinuta.</span>
      <div id="linked-files" aria-label="Povezani fajlovi"></div><form id="composer"><button id="subagents-toggle" aria-label="Sakrij podagente" aria-expanded="true" hidden><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 14h16"/></svg></button><textarea id="prompt" rows="1" placeholder="Poruka" aria-label="Poruka agentu"></textarea><button id="files-open" type="button" aria-label="Fajl sa računara" title="Fajl sa računara">+</button></form>
    </div>
  </main>
  <dialog id="files-dialog" aria-label="Fajl sa računara"><div id="file-entries"></div><footer class="folder-footer"><nav id="folder-shortcuts" aria-label="Folderi"></nav><nav id="folder-breadcrumbs" aria-label="Putanja foldera"></nav><div class="settings-actions"><button id="folder-select" type="button">Poveži folder</button><button id="files-close" type="button" autofocus>Zatvori</button></div></footer></dialog>
  <dialog id="local-file-dialog" aria-label="Fajl sa računara, prikaz"><iframe id="local-file-frame" title="Prikaz fajla" sandbox="allow-scripts"></iframe><button id="local-file-close" type="button">Zatvori</button></dialog>
  <dialog id="delete-dialog" aria-label="Obriši čet"><p id="delete-title"></p><div class="settings-actions"><button id="delete-cancel">Otkaži</button><button id="delete-only">Samo ovaj čet</button><button id="delete-family">Čet i podagenti</button></div></dialog>
  <div id="chat-popover" role="dialog" aria-label="Opcije četa" hidden></div>
  <div id="toast" role="alert" hidden></div><button id="undo-delete" hidden>Vrati obrisane četove</button>
</body>
</html>
